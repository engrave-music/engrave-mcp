#:schema https://docs.clice.io/clice-config.schema.json

# clice project configuration for this checkout: the host build plus the
# pinned engine fork under vendor/engrave. The clice editor extension and
# `scripts/format.py --backend clice` / `scripts/lint.py --backend clice`
# read it.
#
# There is deliberately no vendor/engrave/clice.toml. clice treats a
# directory holding its own clice.toml as an isolated nested project, so an
# engine-level file would take every engine translation unit out of this
# project's database, index, lint and format runs.

# scripts/build-native.* and scripts/bbuild.py default to build/release;
# the other configurations are for debugging and sanitizer work.
default_configuration = "release"

# Vendored third-party code and Pixi environment headers (reached via plain -I
# for zlib/cairo): keep indexed as part of the build, but out of lint and
# format. Worktrees under .worktrees/ carry their own clice.toml and are
# isolated as nested projects automatically.
[[rules]]
patterns = ["vendor/engrave/**/thirdparty/**", ".pixi/**"]
lint = false
format = false

# One tag per Bazel build profile. scripts/bbuild.py defaults to
# `build/<tag>/compile_commands.json` (`bbuild.py --profile <tag> compdb`).
[[rules]]
configuration = "release"
compile_commands = ["build/release"]

[[rules]]
configuration = "debug"
compile_commands = ["build/debug"]

[[rules]]
configuration = "releasedbg"
compile_commands = ["build/releasedbg"]

[[rules]]
configuration = "asan"
compile_commands = ["build/asan"]

[[rules]]
configuration = "tsan"
compile_commands = ["build/tsan"]
