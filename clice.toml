#:schema https://docs.clice.io/clice-config.schema.json

# clice project configuration for this checkout: the host build plus the
# pinned engine fork under vendor/engrave. The clice editor extension and
# `scripts/format.py --backend clice` / `scripts/lint.py --backend clice`
# read it.
#
# There is deliberately no vendor/engrave/clice.toml. clice treats a
# directory holding its own clice.toml as an isolated nested project, so an
# engine-level file would take every engine translation unit out of this
# project's database, index, lint and format runs. Requires clice 1.0+.

# scripts/build-native.* and scripts/xbuild.py default to build/release;
# the other configurations are for debugging and sanitizer work.
default_configuration = "release"

# Code that is not ours to format, lint or index: vendored dependencies
# (engine-declared packages and FetchContent clones), xmake build trees, the
# Pixi environment (whose headers a JavaScript or zlib include reaches with a
# plain -I, which would otherwise make `clice format` rewrite them), runtime
# assets, upstream checkouts and reviewer worktrees.
[[rules]]
patterns = [
  "vendor/engrave/**/thirdparty/**",
  "vendor/engrave/vendor/**",
  "build/**",
  ".pixi/**",
  ".runtime/**",
  ".xmake/**",
  ".clice/**",
  ".upstream/**",
  ".worktrees/**",
]
background_index = false
lint = false
format = false

# One tag per xmake build mode. scripts/xbuild.py defaults to
# `build/<tag>/compile_commands.json` (`xbuild.py --profile <tag> compdb`).
[[rules]]
configuration = "release"
compile_commands = ["build/release"]

[[rules]]
configuration = "debug"
compile_commands = ["build/debug"]

[[rules]]
configuration = "releasedbg"
compile_commands = ["build/releasedbg"]

[[rules]]
configuration = "asan"
compile_commands = ["build/asan"]
