[workspace]
name = "engrave-mcp"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.13.*"
cmake = "4.*"
ninja = "*"
zlib = "*"
cairo = "*"
clang-tools = "==23.1.4"
ruff = "==0.17.3"
prettier = "==3.9.10"
taplo = "==0.10.0"
bazelisk = ">=1.29.0,<2"

[tasks]
build = "python scripts/xbuild.py build"
build-release = "python scripts/xbuild.py --profile release build"
build-debug = "python scripts/xbuild.py --profile debug build"
build-releasedbg = "python scripts/xbuild.py --profile releasedbg build"
build-asan = "python scripts/xbuild.py --profile asan build"
compdb = "python scripts/xbuild.py compdb"
setup-hooks = "python scripts/setup_hooks.py"
format = "python scripts/format.py"
format-check = "python scripts/format.py --check ."
lint = "python scripts/lint.py"
lint-fix = "python scripts/lint.py --fix"

[target.linux-64.dependencies]
c-compiler = "*"
cxx-compiler = "*"
# clang-tidy needs the matching compiler's builtin headers on Linux.
clang-23 = "==23.1.4"
patchelf = "*"

[pypi-dependencies]
mcp = "==2.3.0"
jsonschema = "==4.26.0"
numpy = "==2.5.4"
soundfile = "==0.14.0"
pillow = ">=13.0.0, <14"
pymupdf = ">=2.0, <3"
psutil = ">=7, <8"

engrave-host-testing = { path = ".", editable = true }
engrave-testing = { path = "vendor/engrave", editable = true }
