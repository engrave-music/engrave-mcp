[workspace]
name = "engrave-mcp"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.13.*"
cmake = "4.*"
ninja = "*"
zlib = "*"
cairo = "*"
nlohmann_json = "3.12.*"
clang-tools = "==23.1.4"
ruff = "==0.17.3"
prettier = "==3.9.10"
taplo = "==0.10.0"

[tasks]
build = "xmake build -y"
setup-hooks = "python scripts/setup_hooks.py"
format = "python scripts/format.py"
format-check = "python scripts/format.py --check ."
lint = "python scripts/lint.py"
lint-fix = "python scripts/lint.py --fix"

[target.linux-64.dependencies]
c-compiler = "*"
cxx-compiler = "*"
# clang-tidy needs the matching compiler's builtin headers on Linux.
clang-23 = "==23.1.4"
patchelf = "*"

[environments]
native = { features = [] }

[pypi-dependencies]
mcp = "==2.3.0"
jsonschema = "==4.26.0"
numpy = "==2.5.4"
soundfile = "==0.14.0"
pillow = ">=13.0.0, <14"
pymupdf = ">=2.0, <3"
psutil = ">=7, <8"
