name: CI

# Windows and Linux run release host tests and compare MCP rendering against
# a pinned engine golden. Linux also runs host and engine core tests with
# ASan, LSan, and UBSan. Host API tests use the checked-in sine SoundFont.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIXI_VERSION: v0.84.1
  PYTHONUTF8: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The Pixi environment installs vendor/engrave as an editable package, so
      # the submodule must exist before `pixi install`.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true

      - name: Verify submodule pin and checked-in Bazel inputs
        run: |
          pixi run --locked python scripts/bootstrap.py
          pixi run --locked python scripts/check_build_inputs.py --check
          pixi run --locked python scripts/check_native_includes.py --engine-source vendor/engrave

      - name: Formatting
        run: pixi run --locked format-check

      # Fast static and unit checks: no binary, no runtime assets, no SoundFont.
      - name: Python checks
        shell: bash
        run: |
          set -euo pipefail
          py=.pixi/envs/default/bin/python
          "$py" -c "from pathlib import Path; from engrave_mcp_testing.layout import audit_test_layout; errors = audit_test_layout(Path('.').resolve()); print('\n'.join(errors)); raise SystemExit(bool(errors))"
          "$py" scripts/package_windows.py --check-notices
          "$py" scripts/package_linux.py --check-notices
          for test in \
            tests/integration/test_test_layout.py \
            tests/integration/test_native_includes.py \
            tests/integration/test_engine_gate_wrapper.py \
            tests/integration/test_cleanup_regressions.py \
            tests/integration/test_oracle_harness.py \
            tests/integration/test_rendered_page.py \
            tests/test_engine_gate.py \
            tests/test_bbuild.py \
            tests/test_packaging.py \
            tests/test_release.py \
            tests/test_bazel_server_mcp.py; do
            echo "::group::$test"
            "$py" "$test"
            echo "::endgroup::"
          done

  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-xclang
            runner: windows-latest
          - name: linux-xclang
            runner: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_DIR: build/ci
      REPO_CACHE: build/.bazel_repo_cache
      DISK_CACHE: build/.bazel_disk_cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free runner disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true

      - name: Verify submodule, stage runtime assets, check Bazel inputs
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pixi run --locked python scripts/bootstrap.py
          pixi run --locked python scripts/prepare.py
          pixi run --locked python scripts/check_build_inputs.py --check

      - name: Restore Bazel repository cache
        id: repo-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-${{ matrix.name }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'vendor/engrave/MODULE.bazel', 'vendor/engrave/bazel/deps.bzl') }}
          restore-keys: bazel-repo-${{ matrix.name }}-

      - name: Restore Bazel disk cache
        id: disk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-${{ matrix.name }}-${{ hashFiles('bazel/engrave_mcp.bazelrc') }}-${{ github.sha }}
          restore-keys: bazel-disk-${{ matrix.name }}-${{ hashFiles('bazel/engrave_mcp.bazelrc') }}-

      - name: Build host and host test targets
        id: build
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $targets = @(
            'engrave_mcp', 'engrave_mcp_test', 'registry_dump', 'registry_check',
            'host_api_test', 'staging_test'
          )
          if ($IsLinux) { $targets += 'publication_test' }
          pixi run --locked python scripts/bbuild.py --profile release --build-directory $env:BUILD_DIR -j 4 build @targets

      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.repo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-${{ matrix.name }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'vendor/engrave/MODULE.bazel', 'vendor/engrave/bazel/deps.bzl') }}

      - name: Prune Bazel disk cache
        id: prune-disk-cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.disk-cache.outputs.cache-hit != 'true' }}
        run: pixi run --locked python scripts/bbuild.py --max-disk-cache-mb 2048 --shutdown prune-cache

      - name: Save Bazel disk cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.prune-disk-cache.outcome == 'success' && steps.disk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-${{ matrix.name }}-${{ hashFiles('bazel/engrave_mcp.bazelrc') }}-${{ github.sha }}

      - name: Run host C++ tests
        run: |
          $ErrorActionPreference = 'Stop'
          $ext = $IsWindows ? '.exe' : ''
          $root = $PWD.Path
          $build = Join-Path $root $env:BUILD_DIR
          $py = Join-Path $root ($IsWindows ? '.pixi/envs/default/python.exe' : '.pixi/envs/default/bin/python')
          $out = Join-Path $env:RUNNER_TEMP 'host-tests'
          if ($IsWindows) {
            $env:PATH = (Join-Path $root '.pixi/envs/default/Library/bin') + [IO.Path]::PathSeparator + $env:PATH
          } else {
            $env:LD_LIBRARY_PATH = (Join-Path $root '.pixi/envs/default/lib') + ($env:LD_LIBRARY_PATH ? ":$env:LD_LIBRARY_PATH" : '')
          }
          $sine = Join-Path $root 'vendor/engrave/tests/data/engine_audio/sine.sf2'
          $steps = [ordered]@{
            staging_test = @("$build/staging_test$ext")
            host_api_test = @(
              $py, 'tests/integration/test_host_api.py',
              '--binary', "$build/host_api_test$ext",
              '--resources', "$root/.runtime/assets",
              '--soundfont', $sine, '--replacement-soundfont', $sine,
              '--output', "$out/host-api"
            )
          }
          if ($IsLinux) {
            $steps['publication_test'] = @("$build/publication_test", "$out/publication")
          }
          $failed = @()
          foreach ($name in $steps.Keys) {
            Write-Host "::group::$name"
            $command = $steps[$name]
            & $command[0] @($command | Select-Object -Skip 1)
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) {
              Write-Host "::error title=$name::exited with code $code"
              $failed += $name
            }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

      - name: Run host integration checks
        env:
          ENGRAVE_MCP_OUTPUT: ${{ runner.temp }}/host-tests/imports-guitarpro
        run: |
          $ErrorActionPreference = 'Stop'
          $ext = $IsWindows ? '.exe' : ''
          $root = $PWD.Path
          $build = Join-Path $root $env:BUILD_DIR
          $py = Join-Path $root ($IsWindows ? '.pixi/envs/default/python.exe' : '.pixi/envs/default/bin/python')
          $out = Join-Path $env:RUNNER_TEMP 'host-tests'
          $binary = "$build/engrave-mcp$ext"
          $assets = "$root/.runtime/assets"
          $env:ENGRAVE_MCP_BINARY = $binary
          $env:ENGRAVE_MCP_RESOURCES = $assets
          if ($IsWindows) {
            $env:PATH = (Join-Path $root '.pixi/envs/default/Library/bin') + [IO.Path]::PathSeparator + $env:PATH
          } else {
            $env:LD_LIBRARY_PATH = (Join-Path $root '.pixi/envs/default/lib') + ($env:LD_LIBRARY_PATH ? ":$env:LD_LIBRARY_PATH" : '')
          }
          $common = @('--binary', $binary, '--resources', $assets)
          $checks = [ordered]@{
            cli = @('tests/integration/test_cli.py') + $common + @('--output', "$out/cli")
            version_info = @('tests/integration/test_version_info.py') + $common + @('--output', "$out/version_info")
            open_data = @('tests/integration/test_open_data.py') + $common + @('--output', "$out/open_data")
            native_inputs = @('tests/integration/test_native_inputs.py', '--output', "$out/native_inputs")
            positions = @('tests/integration/test_positions.py') + $common + @('--output', "$out/positions")
            imports_midi = @('tests/integration/test_imports_midi.py') + $common + @('--output', "$out/imports_midi")
            imports_guitarpro = @('tests/integration/test_imports_guitarpro.py')
            repeats = @('tests/integration/test_repeats.py') + $common + @('--output', "$out/repeats", '--upstream', "$root/vendor/engrave")
            transport = @('tests/integration/test_transport.py', $binary, "$out/transport.json")
            package_strip = @('tests/integration/test_package_strip.py', '--binary', $binary, '--output', "$out/package_strip")
          }
          if ($IsWindows) {
            $checks['windows_manifest'] = @('tests/integration/test_windows_manifest.py', $binary, "$build/engrave-mcp-test$ext")
          }
          $failed = @()
          foreach ($name in $checks.Keys) {
            Write-Host "::group::$name"
            & $py @($checks[$name])
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) {
              Write-Host "::error title=$name::exited with code $code"
              $failed += $name
            }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPO_CACHE: build/.bazel_repo_cache
      DISK_CACHE: build/.bazel_disk_cache
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true

      - name: Verify submodule, stage runtime assets, check Bazel inputs
        run: |
          pixi run --locked python scripts/bootstrap.py
          pixi run --locked python scripts/prepare.py
          pixi run --locked python scripts/check_build_inputs.py --check

      - name: Restore Bazel repository cache
        id: repo-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-linux-xclang-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'vendor/engrave/MODULE.bazel', 'vendor/engrave/bazel/deps.bzl') }}
          restore-keys: bazel-repo-linux-xclang-

      - name: Restore sanitized Bazel disk cache
        id: disk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-linux-sanitize-${{ hashFiles('bazel/engrave_mcp.bazelrc') }}-${{ github.sha }}
          restore-keys: bazel-disk-linux-sanitize-${{ hashFiles('bazel/engrave_mcp.bazelrc') }}-

      - name: Build sanitized host and engine tests
        id: build
        run: |
          pixi run --locked python scripts/bbuild.py --profile sanitize -j 4 build \
            engrave_mcp host_api_test staging_test publication_test registry_test engrave_core_tests

      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.repo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-linux-xclang-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'vendor/engrave/MODULE.bazel', 'vendor/engrave/bazel/deps.bzl') }}

      - name: Prune sanitized Bazel disk cache
        id: prune-disk-cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.disk-cache.outputs.cache-hit != 'true' }}
        run: pixi run --locked python scripts/bbuild.py --max-disk-cache-mb 2560 --shutdown prune-cache

      - name: Save sanitized Bazel disk cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.prune-disk-cache.outcome == 'success' && steps.disk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-linux-sanitize-${{ hashFiles('bazel/engrave_mcp.bazelrc') }}-${{ github.sha }}

      - name: Run sanitized host and engine tests
        run: |
          export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          build="$PWD/build/sanitize"
          py="$PWD/.pixi/envs/default/bin/python"
          assets="$PWD/.runtime/assets"
          data="$PWD/vendor/engrave/tests/data/inputs"
          sine="$PWD/vendor/engrave/tests/data/engine_audio/sine.sf2"
          export ASAN_OPTIONS="$ASAN_OPTIONS:log_path=$RUNNER_TEMP/asan"
          export UBSAN_OPTIONS="$UBSAN_OPTIONS:log_path=$RUNNER_TEMP/ubsan"
          export ENGRAVE_MCP_RESOURCES="$assets"
          common=(--binary "$build/engrave-mcp" --resources "$assets")
          "$build/staging_test"
          "$build/registry_test"
          "$build/publication_test" "$RUNNER_TEMP/publication"
          "$py" tests/integration/test_host_api.py --binary "$build/host_api_test" --resources "$assets" \
            --soundfont "$sine" --replacement-soundfont "$sine" --output "$RUNNER_TEMP/host-api"
          "$py" tests/integration/test_cli.py "${common[@]}" --soundfont "$sine" --output "$RUNNER_TEMP/cli"
          "$py" tests/integration/test_transport.py "$build/engrave-mcp" "$RUNNER_TEMP/transport.json"
          "$py" tests/integration/test_open_data.py "${common[@]}" --output "$RUNNER_TEMP/open-data"
          "$py" tests/integration/test_positions.py "${common[@]}" --output "$RUNNER_TEMP/positions"
          for shard in 0 1 2 3; do
            work="$RUNNER_TEMP/core-$shard"
            mkdir -p "$work/tmp"
            (cd "$work" && TMPDIR="$work/tmp" GTEST_TOTAL_SHARDS=4 GTEST_SHARD_INDEX="$shard" \
              "$build/engrave_core_tests" --assets="$assets" --golden-corpus="$data/golden" \
              --inputs-corpus="$data" --python="$py" --mnx-out="$RUNNER_TEMP/mnx-export")
          done

      - name: Check sanitizer reports from child processes
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/asan.* "$RUNNER_TEMP"/ubsan.*)
          if (( ${#reports[@]} )); then
            cat "${reports[@]}"
            exit 1
          fi
